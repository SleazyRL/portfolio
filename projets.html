<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projets de Boguszynski Jakub — Page en construction">
    <title>Projets — Boguszynski Jakub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0d10;
            --panel: #10151a;
            --panel-2: #0d1216;
            --line: #232d34;
            --line-soft: #182027;
            --text: #dbe2e6;
            --text-muted: #7c8790;
            --copper: #c9793d;
            --copper-dim: #8a552b;
            --teal: #4fa9a2;
            --teal-dim: #356e69;
            --radius: 2px;
            --sans: 'IBM Plex Sans', -apple-system, sans-serif;
            --mono: 'IBM Plex Mono', 'SFMono-Regular', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            background-image:
                linear-gradient(var(--line-soft) 1px, transparent 1px),
                linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
            background-size: 48px 48px;
            background-position: -1px -1px;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ::selection {
            background: var(--copper);
            color: #0a0d10;
        }

        .icon {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* Container Panel */
        .construction-panel {
            position: relative;
            border: 1px solid var(--line);
            background: var(--panel);
            padding: 48px 40px;
            max-width: 540px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .construction-panel::before,
        .construction-panel::after {
            content: '';
            position: absolute;
            width: 9px;
            height: 9px;
            border-color: var(--copper-dim);
            border-style: solid;
        }

        .construction-panel::before {
            top: -1px;
            left: -1px;
            border-width: 1px 0 0 1px;
        }

        .construction-panel::after {
            bottom: -1px;
            right: -1px;
            border-width: 0 1px 1px 0;
        }

        .badge {
            width: 42px;
            height: 42px;
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--copper);
            margin: 0 auto 24px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text);
            font-family: var(--sans);
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 12px 20px;
            font-family: var(--mono);
            font-size: 13px;
            letter-spacing: .02em;
            border: 1px solid var(--line);
            color: var(--text);
            transition: border-color .2s, color .2s, background .2s;
        }

        .btn:hover {
            border-color: var(--teal);
            color: var(--teal);
            background: var(--panel-2);
        }

        footer {
            margin-top: 40px;
            font-family: var(--mono);
            font-size: 11.5px;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

    <div class="construction-panel">
        <div class="badge">
            <svg class="icon" viewBox="0 0 24 24" width="22" height="22">
                <rect x="3" y="7" width="18" height="13" rx="1" />
                <path d="M3 7l2-3h6l2 3" />
            </svg>
        </div>
        <h1>Page en construction 💻</h1>
        <p>De nouveaux projets et réalisations seront bientôt publiés ici. Revenez plus tard !</p>
        <a class="btn" href="index.html">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Retour au portfolio
        </a>
    </div>

    <footer>
        © 2026 Boguszynski Jakub — Aurillac, FR
    </footer>

</body>

</html>
